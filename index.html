<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>VulnShop - Tienda de práctica</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background:#f4f4f4; }
  header { background:#222; color:#fff; padding:15px 30px; }
  nav a { color:#fff; margin-right:15px; text-decoration:none; }
  .container { max-width:800px; margin:30px auto; background:#fff; padding:20px; border-radius:6px; }
  input[type=text] { padding:8px; width:70%; }
  button { padding:8px 14px; }
  .result { margin-top:15px; padding:10px; background:#eef; border-radius:4px; }
  footer { text-align:center; color:#888; margin:30px; font-size:12px; }
</style>
</head>
<body>

<header>
  <h1>VulnShop</h1>
  <nav>
    <a href="index.html">Inicio</a>
    <a href="login.html">Login</a>
    <a href="admin.html">Admin</a>
  </nav>
</header>

<div class="container">
  <h2>Buscar productos</h2>
  <!-- Búsqueda reflejada en el DOM sin sanitizar: XSS reflejado -->
  <input type="text" id="q" placeholder="Ej: zapatos">
  <button onclick="buscar()">Buscar</button>
  <div class="result" id="resultado"></div>
</div>

<!-- TODO: quitar antes de producción, endpoint de pruebas -->
<!-- /admin.html usuario temporal: admin / admin123 -->

<footer>Sitio de práctica - no usar en producción</footer>

<script>
  // Lee el parámetro ?q= de la URL y lo inserta directo en el DOM (vulnerable a XSS)
  function getParam(name) {
    const params = new URLSearchParams(window.location.search);
    return params.get(name);
  }

  function buscar() {
    const val = document.getElementById('q').value;
    mostrar(val);
  }

  function mostrar(val) {
    document.getElementById('resultado').innerHTML =
      "Resultados para: " + val + "<br>No se encontraron productos.";
  }

  // Si viene ?q= en la URL, lo refleja automáticamente (XSS reflejado clásico)
  const q = getParam('q');
  if (q) {
    document.getElementById('q').value = q;
    mostrar(q);
  }
</script>

</body>
</html>
